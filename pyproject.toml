[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grocery-agent"
version = "0.1.0"
description = "Plan a week of meals from the web, filtered by your macros, budget and taste, with a costed grocery list."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0",
  "langchain>=1.0",
  "langchain-anthropic>=1.0",
  "recipe-scrapers>=15",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6",
  "ddgs>=9",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0"]
google = ["langchain-google-genai>=3.0"]
dev = ["pytest>=8"]

[project.scripts]
grocery-agent = "grocery_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/grocery_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
